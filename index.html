<style>

:root{

  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a17; --surface:#1a2420; --fg:#e2eae4; --muted:#9db0a5; --line:#2d3b35;
  --accent:#7cc2a2; --accent-fg:#0f1714; --ochre:#e0b25c;

:root[data-theme="dark"]{
  --bg:#121a17; --surface:#1a2420; --fg:#e2eae4; --muted:#9db0a5; --line:#2d3b35;
  --accent:#7cc2a2; --accent-fg:#0f1714; --ochre:#e0b25c;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px}
h1{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.1;margin:0;text-wrap:balance}
.season-line{color:var(--muted);font-size:.95rem;margin:0}
.season-line b{color:var(--ochre);font-weight:600}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 .95rem var(--body);padding:9px 6px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 .88rem var(--body);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.swatch{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.3);display:inline-block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.plate{background:var(--plate);border-bottom:1px solid var(--plate-line);display:flex;justify-content:center;padding:10px 12px 8px;position:relative}
.pic{display:block;width:100%;max-width:420px}
.pic img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--plate-line)}
.pic .credit{display:block;font-size:.66rem;color:#4d5a50;text-align:right;padding:3px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .mini .pic img{aspect-ratio:1;border-radius:8px}
.result .mini .credit{display:none}
.plate svg{width:100%;max-width:340px;height:auto;display:block}
.plate .tag{position:absolute;left:18px;top:16px;z-index:1;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#4d5a50}

.facts{display:flex;flex-wrap:wrap;gap:6px}

.sizebar{display:flex;gap:3px;align-items:flex-end}
.sizebar i{display:block;width:10px;border-radius:2px;background:var(--line)}
.sizebar i.on{background:var(--ochre)}
.name{font-family:var(--display);font-size:1.6rem;line-height:1.15;margin:0}
.sci{font-style:italic;color:var(--muted);margin:0;font-size:.92rem}
.detail{display:flex;flex-direction:column;gap:10px}
.detail p{margin:0;max-width:62ch}
.detail h3{margin:0 0 2px;font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--accent);font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:.9rem}
.links a:hover{border-color:var(--accent)}
.btn{border:0;border-radius:12px;padding:12px 16px;font:600 1rem var(--body);cursor:pointer;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.choices{grid-template-columns:1fr}}
.choice{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:12px 14px;font:600 .98rem var(--body);cursor:pointer}
.choice.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.choice:disabled{cursor:default}
.clue{font-size:1.08rem;margin:0;max-width:60ch}
.clue-q{font-family:var(--display);font-size:1.3rem;margin:0}
.results{display:flex;flex-direction:column;gap:8px}
.result{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px 6px 6px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;width:100%}
.result .mini{background:var(--plate);border-radius:8px;display:flex}
.result .mini svg{width:88px;height:auto}
.result .rn{font-weight:600;min-width:0}
.result .rs{color:var(--muted);font-size:.84rem}
.result .score{font-family:var(--mono);font-size:.75rem;color:var(--ochre)}
.filters{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.filters .group{display:flex;flex-direction:column;gap:6px}
.note{color:var(--muted);font-size:.85rem;margin:0}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--fg)}
.toggle input{accent-color:var(--accent);width:18px;height:18px}
.done{text-align:center;padding:24px 18px;display:flex;flex-direction:column;gap:10px;align-items:center}
.big{font-family:var(--display);font-size:2.6rem;margin:0;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: no-preference){.card{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
</style>

const isSummer = m => m>=3 && m<=8;   // Apr–Sep

// ---------- plate drawing ----------
const O = 'stroke="rgba(0,0,0,.28)" stroke-width="1"';
const ell=(cx,cy,rx,ry,fill,extra="")=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" ${O} ${extra}/>`;
function marksIn(cx,cy,rx,ry,kind,color,seed){
  let out="",i=0;
  for(let y=cy-ry+4;y<cy+ry-2;y+=6){for(let x=cx-rx+4;x<cx+rx-2;x+=7){
    const dx=(x-cx)/rx,dy=(y-cy)/ry; if(dx*dx+dy*dy>0.75) continue; i++;
    const jx=((i*37+seed)%5)-2, jy=((i*53+seed)%3)-1;
    if(kind==="streak") out+=`<path d="M${x+jx},${y+jy} l1,4" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/>`;
    else out+=`<circle cx="${x+jx}" cy="${y+jy}" r="${kind==="heavy"?2.2:1.4}" fill="${color}"/>`;
  }} return out;
}
function songbird(c,f){
  const s=[]; const hr=f.bighead?23:f.smallhead?16:20; const hx=62, hy=58;

  if(f.tailtip) s.push(`<path d="M${tl},94 L${tl-4},106" stroke="${f.tailtip}" stroke-width="5"/>`);
  if(f.rump) s.push(ell(140,82,8,6,f.rump));
  s.push(ell(105,80,46,27,c.back));
  s.push(ell(98,92,38,17,c.belly));
  s.push(ell(76,82,20,19,c.breast));
  const mc = (c.belly==="#fafafa"||c.belly.startsWith("#f")||c.belly.startsWith("#e"))? "#4a3a2e" : "#f2f2ee";
  if(f.streaks){ if(f.streaks!=="belly") s.push(marksIn(76,82,18,17,"streak","#5a3e2c",1)); if(f.streaks!=="breast"&&f.streaks!=="throat") s.push(marksIn(98,93,34,14,"streak","#5a3e2c",3)); }

  else if(c.wingbar && !f.wingspots) s.push(`<path d="M98,80 Q118,86 140,79" stroke="${c.wingbar}" stroke-width="3" fill="none"/><path d="M100,74 Q118,79 136,73" stroke="${c.wingbar}" stroke-width="2" fill="none"/>`);
  if(f.wingspots){ const wc = typeof f.wingspots==="string"?f.wingspots:c.wingbar; [[100,74],[110,78],[120,75],[128,80],[136,76],[114,71]].forEach(([x,y])=>s.push(`<circle cx="${x}" cy="${y}" r="2" fill="${wc}"/>`)); }
  if(f.hummer){ s.push(`<path d="M110,66 Q150,40 170,52 Q140,70 118,76Z" fill="${c.wing}" ${O} opacity=".85"/>`); }
  // head
  s.push(`<circle cx="${hx}" cy="${hy}" r="${hr}" fill="${c.face}" ${O}/>`);
  s.push(`<path d="M${hx-hr},${hy-1} A${hr},${hr} 0 0 1 ${hx+hr},${hy-1} Q${hx},${hy-8} ${hx-hr},${hy-1}Z" fill="${c.crown}"/>`);
  if(f.crownstripe){ s.push(`<path d="M${hx-hr+3},${hy-6} Q${hx},${hy-hr-2} ${hx+hr-2},${hy-5}" stroke="${f.crownstripe}" stroke-width="3" fill="none"/>`); if(f.stripes) s.push(`<path d="M${hx-hr+5},${hy-12} Q${hx},${hy-hr-6} ${hx+hr-6},${hy-13}" stroke="${f.crownstripe}" stroke-width="3" fill="none"/>`); }
  if(f.crest) s.push(`<path d="M${hx+4},${hy-hr+2} L${hx+hr+12},${hy-hr-6} L${hx+hr},${hy-4}Z" fill="${c.crown}" ${O}/>`);
  if(f.nape) s.push(`<rect x="${hx+hr-8}" y="${hy-12}" width="7" height="6" fill="${f.nape}"/>`);

  s.push(ell(hx-2,hy+16,11,7,c.throat));
  if(f.swallow) s.push(`<path d="M${hx-hr+6},${hy+2} Q${hx},${hy+6} ${hx+hr-2},${hy-2}" stroke="#fafafa" stroke-width="5" fill="none"/>`);
  if(f.mask) s.push(`<path d="M${hx-hr+2},${hy-4} L${hx+8},${hy-6} L${hx+6},${hy+2} L${hx-hr+4},${hy+3}Z" fill="${f.mask}"/>`);
  if(f.eyebrow) s.push(`<path d="M${hx-15},${hy-8} Q${hx-4},${hy-14} ${hx+10},${hy-8}" stroke="${f.eyebrow}" stroke-width="3" fill="none" stroke-linecap="round"/>`);
  if(f.eyeline) s.push(`<path d="M${hx-18},${hy-3} L${hx+12},${hy-2}" stroke="${f.eyeline}" stroke-width="3"/><path d="M${hx-15},${hy-9} Q${hx-4},${hy-14} ${hx+10},${hy-9}" stroke="#fafafa" stroke-width="2.5" fill="none"/>`);
  if(f.mustache) s.push(`<path d="M${hx-14},${hy+6} L${hx-2},${hy+10}" stroke="${f.mustache}" stroke-width="3.5" stroke-linecap="round"/>`);
  if(f.eyering) s.push(`<circle cx="${hx-8}" cy="${hy-3}" r="4.6" fill="none" stroke="${typeof f.eyering==='string'?f.eyering:'#fafafa'}" stroke-width="1.8"/>`);
  if(f.ring) s.push(`<path d="M${hx-6},${hy+20} Q${hx+6},${hy+24} ${hx+14},${hy+16}" stroke="${f.ring}" stroke-width="3" fill="none"/>`);
  s.push(`<circle cx="${hx-8}" cy="${hy-3}" r="3" fill="${f.eye||'#111'}" stroke="#111" stroke-width=".8"/><circle cx="${hx-9}" cy="${hy-4}" r=".9" fill="#fff"/>`);
  const bx=hx-hr+1;
  if(f.hummer) s.push(`<path d="M${bx},${hy} L${bx-36},${hy+3} L${bx},${hy+4}Z" fill="${c.bill}"/>`);
  else if(f.bigbill) s.push(`<path d="M${bx+1},${hy-6} L${bx-15},${hy+2} L${bx+1},${hy+8}Z" fill="${c.bill}" ${O}/>`);
  else if(f.longbill) s.push(`<path d="M${bx},${hy-2} L${bx-20},${hy+2} L${bx},${hy+5}Z" fill="${c.bill}" ${O}/>`);
  else s.push(`<path d="M${bx},${hy-3} L${bx-12},${hy+1} L${bx},${hy+5}Z" fill="${c.bill}" ${O}/>`);
  return s.join("");
}
function water(c,f){
  const s=[];
  s.push(`<path d="M10,116 q10,-5 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0" stroke="#6f97ab" stroke-width="2.5" fill="none"/>`);
  s.push(`<path d="M160,92 L184,84 L178,100Z" fill="${c.tail}" ${O}/>`);
  s.push(ell(118,96,52,20,c.back));
  s.push(ell(118,105,46,11,c.belly));
  s.push(ell(76,96,20,17,c.breast));
  s.push(ell(126,90,34,11,c.wing));
  if(c.wingbar) s.push(`<path d="M108,92 L130,94" stroke="${c.wingbar}" stroke-width="5"/>`);
  const nk=f.stubby?{a:"M56,62 L68,60 L82,88 L66,92Z",hx:60,hy:56}:{a:"M52,52 L64,50 L80,88 L64,92Z",hx:56,hy:46};
  s.push(`<path d="${nk.a}" fill="${c.neck||c.throat}" ${O}/>`);
  if(f.ring) s.push(`<path d="M68,80 L80,78" stroke="${f.ring}" stroke-width="3"/>`);
  const {hx,hy}=nk; const r=14;
  s.push(`<circle cx="${hx}" cy="${hy}" r="${r}" fill="${c.face}" ${O}/>`);
  s.push(`<path d="M${hx-r},${hy-1} A${r},${r} 0 0 1 ${hx+r},${hy-1} Q${hx},${hy-6} ${hx-r},${hy-1}Z" fill="${c.crown}"/>`);
  if(f.chinstrap) s.push(`<path d="M${hx-2},${hy+2} Q${hx+6},${hy+12} ${hx+12},${hy+2} Q${hx+6},${hy+6} ${hx-2},${hy+2}Z" fill="${c.throat}"/><path d="M${hx},${hy-2} Q${hx+6},${hy+10} ${hx+12},${hy}" stroke="${c.throat}" stroke-width="4" fill="none"/>`);
  s.push(`<circle cx="${hx-5}" cy="${hy-3}" r="2.2" fill="#111"/>`);
  const bl=f.stubby?12:19;
  s.push(`<path d="M${hx-13},${hy-2} L${hx-13-bl},${hy+1} L${hx-13-bl},${hy+6} L${hx-13},${hy+5}Z" fill="${c.bill}" ${O}/>`);
  return s.join("");
}
function wader(c,f){
  const s=[];
  s.push(`<path d="M112,86 L108,136 M122,86 L126,136" stroke="#8a7a5a" stroke-width="3"/>`);
  s.push(`<path d="M146,70 L172,80 L146,86Z" fill="${c.tail}" ${O}/>`);
  s.push(ell(118,70,34,20,c.back));
  s.push(ell(112,82,26,9,c.belly));
  s.push(`<path d="M80,30 Q70,48 86,60 Q94,68 92,76 L106,70 Q102,58 96,52 Q86,42 92,30Z" fill="${c.breast}" ${O}/>`);
  s.push(`<path d="M82,34 Q76,48 88,58" stroke="${c.throat}" stroke-width="4" fill="none"/>`);
  s.push(ell(126,66,30,14,c.wing));
  s.push(`<circle cx="86" cy="24" r="9" fill="${c.face}" ${O}/>`);
  if(f.plume) s.push(`<path d="M78,19 Q88,14 96,20" stroke="${f.plume}" stroke-width="3.5" fill="none"/><path d="M95,20 L118,16" stroke="${f.plume}" stroke-width="1.8"/>`);
  s.push(`<circle cx="82" cy="23" r="1.9" fill="#e8c020" stroke="#111" stroke-width=".8"/>`);
  s.push(`<path d="M78,22 L42,26 L78,28Z" fill="${c.bill}" ${O}/>`);
  return s.join("");
}
function raptor(c,f){
  const s=[]; const r=f.smallhead?12:17; const hx=92, hy=f.smallhead?40:36;
  s.push(`<path d="M60,131 L150,131" stroke="#6b5640" stroke-width="5" stroke-linecap="round"/>`);
  s.push(`<path d="M90,108 L112,108 L118,132 L86,132Z" fill="${c.tail}" ${O}/>`);
  s.push(ell(104,76,28,40,c.back));
  s.push(ell(96,88,18,26,c.belly));
  s.push(ell(94,64,17,15,c.breast));
  if(f.streaks==="belly") s.push(marksIn(96,92,16,10,"streak","#4a3020",5));
  if(f.streaks==="breast") {s.push(`<path d="M80,58 Q94,66 108,58" stroke="#7a5a40" stroke-width="3" fill="none"/>`);s.push(marksIn(94,62,14,8,"spot","#7a5a40",7));}
  if(f.spots==="belly") s.push(marksIn(96,90,15,18,"spot","#3a2a20",8));
  s.push(ell(114,78,16,37,c.wing));
  s.push(`<path d="M90,118 L90,131 M100,118 L100,131" stroke="#d0a830" stroke-width="3"/>`);
  s.push(`<circle cx="${hx}" cy="${hy}" r="${r}" fill="${c.face}" ${O}/>`);
  s.push(`<path d="M${hx-r},${hy-1} A${r},${r} 0 0 1 ${hx+r},${hy-1} Q${hx},${hy-6} ${hx-r},${hy-1}Z" fill="${c.crown}"/>`);
  if(!f.smallhead) s.push(ell(hx-2,hy+13,9,6,c.throat));
  if(f.eyeline) s.push(`<path d="M${hx-12},${hy-3} L${hx+14},${hy+6}" stroke="${f.eyeline}" stroke-width="3.5"/>`);
  if(f.mustache) s.push(`<path d="M${hx-9},${hy+1} L${hx-8},${hy+12} M${hx+2},${hy} L${hx+4},${hy+12}" stroke="${f.mustache}" stroke-width="3"/>`);
  s.push(`<circle cx="${hx-7}" cy="${hy-3}" r="2.8" fill="${f.eye||'#111'}" stroke="#111" stroke-width=".8"/>`);
  const bx=hx-r+1;
  s.push(`<path d="M${bx},${hy-2} L${bx-10},${hy+2} Q${bx-11},${hy+9} ${bx-5},${hy+7} L${bx+1},${hy+5}Z" fill="${c.bill}" ${O}/>`);
  return s.join("");
}
function plate(b){
  const g = b.shape==="water"?water:b.shape==="wader"?wader:b.shape==="raptor"?raptor:songbird;
  return `<svg viewBox="0 0 210 140" role="img" aria-label="Color plate of a mystery bird">${g(b.c,b.f||{})}</svg>`;
}
// ---------- photos (iNaturalist, loaded live; drawn plate shows until a photo arrives) ----------
const photoCache = (()=>{try{return JSON.parse(localStorage.getItem("ybt.photos")||"{}")}catch(e){return {}}})();
const inflight = {};
function getPhoto(b){
  if(photoCache[b.s]) return Promise.resolve(photoCache[b.s]);
  if(inflight[b.s]) return inflight[b.s];
  const url = "https://api.inaturalist.org/v1/taxa?rank=species&per_page=1&q="+encodeURIComponent(b.s);
  inflight[b.s] = fetch(url).then(r=>r.ok?r.json():Promise.reject()).then(j=>{
    const p=j.results&&j.results[0]&&j.results[0].default_photo; if(!p) return null;
    const v={m:p.medium_url,sq:p.square_url,a:p.attribution||""};
    photoCache[b.s]=v; try{localStorage.setItem("ybt.photos",JSON.stringify(photoCache))}catch(e){}
    return v;
  }).catch(()=>null);
  return inflight[b.s];
}
const pic = (b,small) => `<span class="pic" data-n="${b.n}" data-small="${small?1:""}">${plate(b)}</span>`;
function hydrate(root){
  root.querySelectorAll(".pic[data-n]").forEach(el=>{
    const b=B.find(x=>x.n===el.dataset.n); el.removeAttribute("data-n");
    getPhoto(b).then(p=>{ if(!p) return;
      const img=new Image(); img.alt="Photo of a bird"; img.loading="lazy";
      img.onload=()=>{el.innerHTML=""; el.appendChild(img); const c=document.createElement("span"); c.className="credit"; c.textContent=p.a+" · iNaturalist"; el.appendChild(c);};
      img.src = el.dataset.small ? p.sq : p.m;
    });
  });
}
const sizebar = n => `<span class="sizebar" title="${SIZE_TXT[n]}" aria-hidden="true">${[1,2,3,4,5].map(i=>`<i class="${i===n?'on':''}" style="height:${4+i*3}px"></i>`).join("")}</span>`;
const slug = n => n.replace(/'/g,"").replace(/ /g,"_");
function detailHTML(b){
  return `<div class="detail">
    <div><p class="name">${b.n}</p><p class="sci">${b.s}</p></div>
    <div><h3>Field marks</h3><p>${b.marks}</p></div>
    <div><h3>Listen for</h3><p>${b.sound}</p></div>
    <div class="links">
      <a href="https://www.allaboutbirds.org/guide/${slug(b.n)}" target="_blank" rel="noopener">Photos &amp; sounds ↗</a>
      <a href="https://xeno-canto.org/explore?query=${encodeURIComponent(b.n)}" target="_blank" rel="noopener">Recordings ↗</a>
      <a href="https://ebird.org/species/search?q=${encodeURIComponent(b.n)}" target="_blank" rel="noopener">eBird ↗</a>
    </div></div>`;
}
const factsHTML = b => `<div class="facts">
  <span class="fact">${sizebar(b.size)} ${SIZE_TXT[b.size]}</span>
  <span class="fact">${SEASON_TXT[b.season]}</span>
  ${b.hab.map(h=>`<span class="fact">${HAB_TXT[h]}</span>`).join("")}</div>`;

// ---------- storage ----------
const store = {
  get(k,d){try{const v=localStorage.getItem("ybt."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("ybt."+k,JSON.stringify(v))}catch(e){}}
};
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pool = () => document.getElementById("inSeason").checked ? B.filter(here) : B;

// ---------- flashcards ----------
let deck=[], idx=0, flipped=false, learned=new Set(store.get("learned",[]));
function newDeck(){
  const p=pool(); const todo=p.filter(b=>!learned.has(b.n));
  deck = shuffle(todo.length?todo:p); idx=0; flipped=false; renderCards();
}
function renderCards(){
  const v=document.getElementById("view-cards");
  const p=pool(); const done=p.filter(b=>learned.has(b.n)).length;
  if(idx>=deck.length){
    v.innerHTML=`<div class="card"><div class="done"><p class="big">${done} / ${p.length}</p><p>birds marked "Got it" in this set.</p>
      <div class="btns" style="width:100%"><button class="btn" id="again">Study again</button><button class="btn ghost" id="reset">Reset progress</button></div></div></div>`;
    v.querySelector("#again").onclick=newDeck;
    v.querySelector("#reset").onclick=()=>{learned.clear();store.set("learned",[]);newDeck()};
    return;
  }
  const b=deck[idx];
  v.innerHTML=`<div class="card">
    <div class="plate"><span class="tag">Card ${idx+1} of ${deck.length}</span>${pic(b)}</div>
    <div class="card-body">
      ${factsHTML(b)}
      ${flipped?detailHTML(b):`<p class="clue-q">Who's this?</p><p class="note">Think of the name, then check. Photos may show a female or young bird.</p>`}
      <div class="btns">${flipped
        ?`<button class="btn ghost" id="still">Still learning</button><button class="btn" id="got">Got it</button>`
        :`<button class="btn" id="flip">Show answer</button>`}</div>
    </div></div>
    <div class="meta"><span>${done} of ${p.length} learned</span><button class="chip" id="shuf">Shuffle</button></div>`;
  if(flipped){
    v.querySelector("#got").onclick=()=>{learned.add(b.n);store.set("learned",[...learned]);idx++;flipped=false;renderCards()};
    v.querySelector("#still").onclick=()=>{deck.push(b);idx++;flipped=false;renderCards()};
  } else v.querySelector("#flip").onclick=()=>{flipped=true;renderCards()};
  v.querySelector("#shuf").onclick=newDeck;
  hydrate(v);
}

// ---------- quiz ----------
let qMode=store.get("qmode","look"), qList=[], qi=0, qScore=0, qAnswered=false, qChoices=[];
function newQuiz(){ qList=shuffle(pool()).slice(0,10); qi=0; qScore=0; nextQ(); }
function nextQ(){
  qAnswered=false;
  if(qi<qList.length){
    const b=qList[qi]; const p=pool();
    const near=shuffle(p.filter(x=>x!==b && Math.abs(x.size-b.size)<=1));
    const rest=shuffle(p.filter(x=>x!==b && !near.includes(x)));
    qChoices=shuffle([b,...near.concat(rest).slice(0,3)]);
  }
  renderQuiz();
}
function renderQuiz(){
  const v=document.getElementById("view-quiz");
  const best=store.get("best_"+qMode,0);
  const modes=`<div class="row"><span class="label">Clue</span>
    ${[["look","Plate"],["listen","Sound"],["marks","Field marks"]].map(([k,t])=>`<button class="chip" data-mode="${k}" aria-pressed="${qMode===k}">${t}</button>`).join("")}</div>`;
  if(qi>=qList.length){
    if(qScore>best) store.set("best_"+qMode,qScore);
    v.innerHTML=`${modes}<div class="card" style="margin-top:12px"><div class="done"><p class="big">${qScore} / ${qList.length}</p>
      <p>${qScore>best?"New best for this clue type.":`Best so far: ${Math.max(best,qScore)} / 10`}</p>
      <button class="btn" id="qagain">New round</button></div></div>`;
    v.querySelector("#qagain").onclick=newQuiz; bindModes(v); return;
  }
  const b=qList[qi];
  let prompt;
  if(qMode==="look") prompt=`<div class="plate">${pic(b)}</div>`;
  else prompt=`<div class="card-body" style="padding-bottom:0"><span class="label">${qMode==="listen"?"You hear":"You see"}</span><p class="clue">${qMode==="listen"?b.sound:b.marks.replace(new RegExp(b.n.split(" ").pop(),"gi"),"___")}</p></div>`;
  v.innerHTML=`${modes}
    <div class="card" style="margin-top:12px">${prompt}
      <div class="card-body">
        ${qMode==="look"?factsHTML(b):""}
        <div class="choices">${qChoices.map((c,i)=>`<button class="choice" data-i="${i}">${c.n}</button>`).join("")}</div>
        <div id="qfb"></div>
      </div></div>
    <div class="meta"><span>Question ${qi+1} of ${qList.length}</span><span>Score ${qScore}</span></div>`;
  bindModes(v); hydrate(v);
  v.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{
    if(qAnswered) return; qAnswered=true;
    const pick=qChoices[+btn.dataset.i]; const ok=pick===b; if(ok) qScore++;
    v.querySelectorAll(".choice").forEach(x=>{x.disabled=true; const c=qChoices[+x.dataset.i]; if(c===b) x.classList.add("right"); else if(x===btn) x.classList.add("wrong");});
    v.querySelector("#qfb").innerHTML=`${qMode!=="look"?`<div class="plate" style="border-radius:12px;border:0">${pic(b)}</div>`:""}${detailHTML(b)}<div class="btns" style="margin-top:12px"><button class="btn" id="qnext">${qi+1<qList.length?"Next bird":"See score"}</button></div>`;
    v.querySelector(".meta span:last-child").textContent="Score "+qScore;
    hydrate(v.querySelector("#qfb"));
    v.querySelector("#qnext").onclick=()=>{qi++;nextQ()};
    v.querySelector("#qnext").focus();
  });
}
function bindModes(v){ v.querySelectorAll("[data-mode]").forEach(c=>c.onclick=()=>{qMode=c.dataset.mode;store.set("qmode",qMode);newQuiz()}); }

// ---------- identify ----------
const idf={size:null,hab:null,col:new Set()};
function renderID(){
  const v=document.getElementById("view-id");
  const chips=(group,items,cur)=>items.map(([k,t,sw])=>`<button class="chip" data-g="${group}" data-k="${k}" aria-pressed="${group==='col'?idf.col.has(k):cur==k}">${sw?`<span class="swatch" style="background:${sw}"></span>`:""}${t}</button>`).join("");
  let list=pool().filter(b=>(!idf.size||Math.abs(b.size-idf.size)<=0 )&&(!idf.hab||b.hab.includes(idf.hab)));
  list=list.map(b=>({b,score:[...idf.col].filter(c=>b.col.includes(c)).length})).filter(x=>!idf.col.size||x.score>0)
    .sort((a,z)=>z.score-a.score || (a.b.col.length-z.b.col.length) || a.b.n.localeCompare(z.b.n));
  v.innerHTML=`<div class="filters">
    <div class="group"><span class="label">How big?</span><div class="row">${chips("size",[[1,"Tiny"],[2,"Sparrow"],[3,"Robin"],[4,"Crow"],[5,"Larger"]],idf.size)}</div></div>
    <div class="group"><span class="label">Where was it?</span><div class="row">${chips("hab",Object.entries(HAB_TXT),idf.hab)}</div></div>
    <div class="group"><span class="label">Colors you noticed</span><div class="row">${chips("col",Object.keys(COLORS).map(k=>[k,k[0].toUpperCase()+k.slice(1),COLORS[k]]))}</div></div>
    <div class="row" style="justify-content:space-between"><span class="note">${list.length} possible bird${list.length===1?"":"s"}</span><button class="chip" id="clr">Clear</button></div>
  </div>
  <div id="pick"></div>
  <div class="results" style="margin-top:12px">${list.map(({b,score})=>`<button class="result" data-n="${b.n}">
     <span class="mini">${pic(b,true)}</span>
     <span class="rn">${b.n}<br><span class="rs">${SIZE_TXT[b.size].split(",")[0]} · ${b.hab.map(h=>HAB_TXT[h]).join(", ")}</span></span>
     <span class="score">${idf.col.size?`${score}/${idf.col.size}`:""}</span></button>`).join("")
     || `<p class="note">No match. Try removing a color or picking a size one step up or down.</p>`}</div>`;
  v.querySelectorAll("[data-g]").forEach(c=>c.onclick=()=>{
    const g=c.dataset.g,k=c.dataset.k;
    if(g==="col"){idf.col.has(k)?idf.col.delete(k):idf.col.add(k)}
    else if(g==="size"){idf.size=idf.size==k?null:+k}
    else {idf.hab=idf.hab===k?null:k}
    renderID();
  });
  hydrate(v);
  v.querySelector("#clr").onclick=()=>{idf.size=null;idf.hab=null;idf.col.clear();renderID()};
  v.querySelectorAll(".result").forEach(r=>r.onclick=()=>{
    const b=B.find(x=>x.n===r.dataset.n);
    const p=v.querySelector("#pick");
    p.innerHTML=`<div class="card" style="margin-top:12px"><div class="plate">${pic(b)}</div><div class="card-body">${factsHTML(b)}${detailHTML(b)}<button class="btn ghost" id="closepick">Close</button></div></div>`;
    hydrate(p);
    p.querySelector("#closepick").onclick=()=>{p.innerHTML=""};
    p.scrollIntoView({behavior:"smooth",block:"start"});
  });
}

// ---------- tabs ----------
const views={cards:"view-cards",quiz:"view-quiz",id:"view-id"};
function show(t){
  Object.entries(views).forEach(([k,id])=>{document.getElementById(id).hidden=k!==t;document.getElementById("tab-"+k).setAttribute("aria-selected",k===t)});
  store.set("tab",t);
}
Object.keys(views).forEach(k=>document.getElementById("tab-"+k).onclick=()=>show(k));
document.getElementById("inSeason").onchange=()=>{newDeck();newQuiz();renderID()};
newDeck(); newQuiz(); renderID();
const hashTab = location.hash.replace("#","");
show(views[hashTab]?hashTab:store.get("tab","cards"));
</script>
